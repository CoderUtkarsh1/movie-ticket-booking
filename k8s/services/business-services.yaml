# All 7 Business Microservices
# Same pattern: Deployment + ClusterIP Service
# All connect to config-server + eureka + read secrets/config from K8s

---
# ===================== USER SERVICE =====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: movie-booking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: utkarshcoder1/movie-user-service:latest
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_CLOUD_CONFIG_URI
              value: "http://config-server:8888"
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          resources:
            requests: { memory: "256Mi", cpu: "100m" }
            limits: { memory: "384Mi", cpu: "300m" }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            initialDelaySeconds: 45
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: movie-booking
spec:
  selector:
    app: user-service
  ports:
    - port: 8081
      targetPort: 8081

