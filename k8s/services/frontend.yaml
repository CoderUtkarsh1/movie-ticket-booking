# Frontend — Nginx serving React app, NodePort 30000
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: movie-booking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: utkarshcoder1/movie-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests: { memory: "32Mi", cpu: "25m" }
            limits: { memory: "64Mi", cpu: "100m" }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: movie-booking
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30000
