server:
  port: 8761

spring:
  application:
    name: eureka-server

# Eureka Server Configuration
# Since this IS the server, it should NOT register with itself
# and should NOT try to fetch registry from itself
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8761/eureka/
  server:
    # Disable self-preservation in dev (enable in production)
    enable-self-preservation: false
    # Cleanup interval for expired instances
    eviction-interval-timer-in-ms: 5000
  instance:
    hostname: localhost

# Actuator Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always
